[package]
name = "reacopilot-core"
version = "0.1.0"
edition = "2021"
description = "Static analysis and AI plumbing for ReaCopilot"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
goblin = "0.9"
iced-x86 = "1.21"
sha2 = "0.10"
md-5 = "0.10"
reqwest = { version = "0.12", features = ["json"] }
