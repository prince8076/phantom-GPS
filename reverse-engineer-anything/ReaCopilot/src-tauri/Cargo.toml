[package]
name = "reacopilot"
version = "0.1.0"
description = "AI-assisted reverse-engineering workbench"
edition = "2021"

[lib]
name = "reacopilot_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
reacopilot-core = { path = "../core" }
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rfd = "0.15"
